</style></head><body><header><h1>兰斯10：界面结构、显示时机与留白</h1><p>29张参考图，18个观察页面。原图与本作截图可对照；标注为研究用近似区域，非原作规格，也不是本作新界面效果图。</p><p><a href="../../docs/design-reviews/2026-10-27_兰斯10界面结构与信息减法研究.md">阅读完整研究</a><a href="sources.json">图片来源清单</a></p></header><main><nav aria-label="参考页面" id="navigation"></nav><article><h2 id="title"></h2><div id="kind"></div><div class="toolbar"><label><input type="checkbox" id="annotations"> 显示区域标注</label><label id="compareLabel"><input type="checkbox" id="comparison"> 对照本作</label><a id="source" target="_blank" rel="noopener">查看来源页面</a></div><div id="figures"><figure><div class="image" id="reference"><img id="referenceImage" alt=""></div><figcaption>兰斯10参考截图 · <a id="fullReference" target="_blank">打开原图</a></figcaption></figure><figure id="current" class="hidden"><div class="image"><img id="currentImage" alt=""></div><figcaption id="currentCaption"></figcaption></figure></div><div class="notes"><section><h3>原图观察</h3><p id="observation"></p></section><section><h3>本作对应</h3><p id="proposal"></p></section></div><p class="boundary">已核实官方开发期资料与发售后截图的构图。没有实际运行原作；完整存档、设置页的视觉证据不足，不据此推定具体布局。天下与路线的本作对照来自先前布局基线，其中演练文案不代表当前运行规则。战斗对照已换为本轮实际简洁HUD。</p></article></main><script>const pages=[{"title": "天下总览", "image": "reference/system-03_01.jpg", "source": "https://www.alicesoft.com/rance10/system/index.html", "kind": "官方开发期画面", "observation": "阶段与战区居于地图，人物承担大块画面。", "proposal": "本作先让山河与战事成立；选择州域后再展开行动。", "current": "../../docs/design-reviews/evidence/2026-10-27/chronicle/08-world-1280.png", "regions": [[0, 18, 33, 82, "人物"], [34, 14, 58, 70, "战区与局势"]]}, {"title": "地区详情", "image": "reference/release-region-panel.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "地区信息作为地图内的展开状态。", "proposal": "详细侧栏只服务于当前选择，不固定套用到所有页面。", "current": "", "regions": [[29, 8, 69, 77, "所选地区信息"]]}, {"title": "任务选择", "image": "reference/release-quest-list.jpg", "source": "https://monokuror.hatenablog.jp/entry/2018/03/01/000000", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "右侧任务列表、地图定位、人物附近的选择说明。", "proposal": "行动列表与其后果放在同一上下文中；不夹带施工说明。", "current": "", "regions": [[74, 6, 26, 92, "候选行动"], [0, 73, 50, 23, "当前选择的简述"]]}, {"title": "就地确认", "image": "reference/release-quest-confirm.jpg", "source": "https://monokuror.hatenablog.jp/entry/2018/02/25/000000", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "确认按钮紧邻选中任务；背景仍然可辨。", "proposal": "出征确认保留原先选择的位置，不再用大页重复全部内容。", "current": "", "regions": [[75, 30, 22, 21, "选择与确认"]]}, {"title": "区域路线", "image": "reference/release-route-choice.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "中心路线、左侧人物、右侧分支动作。", "proposal": "默认突出当前地点及下一组分岔；整章目录不常驻。", "current": "../../docs/design-reviews/evidence/2026-10-27/chronicle/10-route-1280.png", "regions": [[1, 18, 32, 81, "人物"], [30, 12, 45, 74, "附近路线"], [74, 14, 25, 49, "分支选择"]]}, {"title": "编队人物库", "image": "reference/release-roster.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "配置在上、候选在下、队伍汇总在侧。", "proposal": "整备同时呈现已选与候选；选中后并列前台、支援、持有摘要。", "current": "../../docs/design-reviews/evidence/2026-10-27/combat-reuse/screens/05-roster.png", "regions": [[0, 0, 81, 31, "已配置"], [0, 31, 81, 63, "分类与候选"], [81, 0, 19, 94, "队伍汇总"]]}, {"title": "能力阅读", "image": "reference/system-07_03.jpg", "source": "https://www.alicesoft.com/rance10/system/index.html", "kind": "官方开发期画面", "observation": "卡位中出现密集的能力文字。", "proposal": "详情可以密，但不能把三种核心能力拆成五页来回看。", "current": "", "regions": [[0, 37, 79, 56, "能力阅读区域"]]}, {"title": "战前准备", "image": "reference/release-prebattle.jpg", "source": "https://kageyama-dcd.hatenablog.com/entry/2018/03/07/224507", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "敌方、开战按钮、条件与阵容出现在同一画面。", "proposal": "关前集中编队、装备与本关条件，只保留一个明确的出战动作。", "current": "../../docs/design-reviews/evidence/2026-10-27/combat-reuse/screens/06-preparation.png", "regions": [[76, 20, 23, 28, "胜负条件"], [43, 49, 16, 18, "开始战斗"]]}, {"title": "战斗操作", "image": "reference/system-07_01.jpg", "source": "https://www.alicesoft.com/rance10/system/index.html", "kind": "官方开发期画面", "observation": "原作下部卡牌区承担回合制多人行动。", "proposal": "本作采用旧版简单底栏；两项手动技能不需要三套展开的技能行。", "current": "../../docs/design-reviews/evidence/2026-10-27/hud-layout/screens/07-emma.png", "regions": [[0, 0, 100, 56, "敌方与战场"], [0, 56, 100, 12, "生命、回合与AP"], [0, 68, 100, 32, "人物行动"]]}, {"title": "宝箱选卡", "image": "reference/official-treasure.jpg", "source": "https://www.alicesoft.com/information/2017/entry002334.html", "kind": "官方开发期画面", "observation": "人物卡面、获得标记与增量构成选择主体。", "proposal": "五选二等规则保留；卡面放大，焦点详情集中，去掉重复按钮。", "current": "../../docs/design-reviews/evidence/2026-10-27/combat-reuse/screens/04-first-reward.png", "regions": [[26, 0, 72, 94, "候选与获得结果"]]}, {"title": "剧情入队", "image": "reference/official-acquisition.jpg", "source": "https://www.alicesoft.com/information/2017/entry002334.html", "kind": "官方开发期画面", "observation": "单张新人物卡承担获得反馈。", "proposal": "艾玛直接加入与正常抽卡分清顺序，不重复解释存档事务。", "current": "", "regions": [[29, 0, 50, 100, "获得人物"]]}, {"title": "经验结算", "image": "reference/release-victory.jpg", "source": "https://monokuror.hatenablog.jp/entry/2018/02/25/000000", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "上部经验结果、下部参战人物，中间留出空区。", "proposal": "结算优先告诉玩家发生了什么变化，不同时承担下一关规划。", "current": "", "regions": [[28, 20, 43, 40, "经验结果"], [21, 68, 58, 31, "参战人物"]]}, {"title": "人物事件选择", "image": "reference/official-food.jpg", "source": "https://www.alicesoft.com/information/2017/entry002334.html", "kind": "官方开发期画面", "observation": "候选人物与当前事件资源构成专门选择页。", "proposal": "借鉴人物主体；不新增未经确认的食券或好感度系统。", "current": "", "regions": [[22, 14, 76, 69, "人物候选"]]}, {"title": "剧情对白", "image": "reference/release-dialogue-scene.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "背景与人物是主体，台词占较低的下方区域。", "proposal": "此时收起队伍统计和全局导航，把空间给角色。", "current": "../../docs/design-reviews/evidence/2026-10-27/chronicle/02-opening-event-1280.png", "regions": [[19, 0, 61, 77, "人物与场景"], [14, 75, 81, 23, "台词"]]}, {"title": "天下战况", "image": "reference/release-report.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "战争数字集中在一个结果状态中。", "proposal": "大战役后汇总真实局势变化；普通关不重复全世界报表。", "current": "", "regions": [[0, 13, 30, 70, "一方战况"], [70, 13, 30, 70, "另一方战况"]]}, {"title": "系统菜单", "image": "reference/release-system-menu.jpg", "source": "https://manga-games.com/rance10-play-diary-0/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "命令沿两侧展开，保留底下页面的上下文。", "proposal": "保存、设置、鉴赏进入菜单；不持续围住主线页面。", "current": "", "regions": [[0, 0, 34, 100, "系统命令"], [67, 0, 33, 100, "系统命令"]]}, {"title": "鉴赏目录", "image": "reference/release-achievements.jpg", "source": "https://game.girldoll.org/rance10-review/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "分类、紧凑列表、分页集中服务鉴赏。", "proposal": "见闻与音乐不必成为每张页面的强入口。", "current": "", "regions": [[0, 15, 87, 76, "条目与分页"], [88, 15, 12, 76, "分类"]]}, {"title": "标题入口", "image": "reference/release-title.jpg", "source": "https://manga-games.com/rance10-play-diary-0/", "kind": "发售后游玩截图 · 补丁版本未核实", "observation": "标题标识与两项主要入口居中，系统菜单收在角落。", "proposal": "继续与新行军优先，设置与版本过渡功能退到次级。", "current": "../../docs/design-reviews/evidence/2026-10-27/combat-reuse/screens/01-title.png", "regions": []}];

let active=0;const $=id=>document.getElementById(id);for(let i=0;i<pages.length;i++){const b=document.createElement('button');b.textContent=pages[i].title;b.onclick=()=>show(i);$('navigation').append(b)}function show(i){active=i;const p=pages[i];$('title').textContent=p.title;$('kind').textContent=p.kind;$('observation').textContent=p.observation;$('proposal').textContent=p.proposal;$('source').href=p.source;const refImage=$('referenceImage');refImage.onerror=()=>{refImage.onerror=null;if(referenceUrls[p.image])refImage.src=referenceUrls[p.image]};refImage.src=p.image;$('referenceImage').alt='兰斯10 '+p.title+' 原图';$('fullReference').href=referenceUrls[p.image]||p.image;for(const [j,b] of Array.from($('navigation').children).entries())b.setAttribute('aria-current',String(i===j));$('compareLabel').classList.toggle('hidden',!p.current);const compare=$('comparison').checked&&Boolean(p.current);$('current').classList.toggle('hidden',!compare);$('figures').classList.toggle('compare',compare);if(p.current){$('currentImage').src=p.current;$('currentImage').alt='本作 '+p.title+' 对照';$('currentCaption').textContent='本作实际Godot截图 · '+(p.current.includes('/chronicle/')?'先前布局基线；文案以当前源码为准':'2026-10-27')};for(const r of $('reference').querySelectorAll('.region'))r.remove();if($('annotations').checked){for(const [x,y,w,h,label] of p.regions){const r=document.createElement('div');r.className='region';Object.assign(r.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});const s=document.createElement('span');s.textContent=label;r.append(s);$('reference').append(r)}}}for(const id of ['annotations','comparison'])$(id).onchange=()=>show(active);show(0);
